# Release the rail0-go module when an approved release pull request merges.
#
# Releasing is three steps:
#   1. bin/release-prepare opens "chore(release): vX.Y.Z", which bumps Version in
#      version.go and carries the release notes in its body;
#      Run on a feature branch instead, it bumps the version there and writes the notes
#      into that branch's open pull request: one approval for the change and its release;
#   2. a reviewer approves it and it is merged;
#   3. this workflow, on that push to main: plan → gate (ci.yml on the release commit)
#      → tag vX.Y.Z + GitHub release → Slack.
#
# A Go module has no registry upload: the tag IS the release (the module proxy and `go
# get` resolve it). So the one thing this workflow guards is that the tag lands only on
# the reviewed commit that set version.go, only after CI passed on it, and never by hand.
# A push that does not change the version is a no-op (plan stops); "Run workflow"
# (workflow_dispatch, main only) resumes a run that stopped before the tag.
#
# The release commit is the one that SET the version (the release PR's merge), found from
# history, not the head of main: a resume after other merges still tags exactly the
# reviewed commit.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # resume a release that stopped halfway; refused off main

permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: github.com/commercelayer/rail0-go

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases run from main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history (the commit that set the version) and tags

      - name: What to release
        id: plan
        run: |
          set -euo pipefail
          version_at() {
            git show "$1:version.go" 2>/dev/null | sed -n 's/^const Version = "\([^"]*\)".*$/\1/p' | head -n 1 || true
          }

          version="$(version_at HEAD)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.go Version '$version' is not X.Y.Z"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists: nothing to release"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit that set this version: the newest first-parent commit of main whose
          # version differs from its parent's.
          commit=""
          for c in $(git log --first-parent --format=%H -- version.go); do
            if [ "$(version_at "$c")" = "$version" ] && [ "$(version_at "$c^1")" != "$version" ]; then
              commit="$c"
              break
            fi
          done
          if [ -z "$commit" ]; then
            echo "::error::cannot find the commit that set version $version"
            exit 1
          fi

          latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::$version is older than the latest tag $latest"
            exit 1
          fi

          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          {
            echo "### Releasing $PACKAGE $version"
            echo "- commit: \`$commit\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # No release without a second person. The commit that set the version must have reached
  # main through a merged pull request that a reviewer OTHER THAN ITS AUTHOR approved, on
  # the pull request's final commit (an approval followed by a new push, a dismissal or a
  # change request does not count). Branch protection already asks for a review, but an
  # admin can bypass it, a bare push to main has no review at all, and a "Run workflow"
  # resume runs long after the merge: this job is the check that cannot be skipped, on the
  # exact commit about to ship. Bots never count as the reviewer.
  approval:
    name: Approved by a third-party reviewer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Release pull request approved by someone other than its author
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number | tostring] | join(" ")')"
          if [ -z "$prs" ]; then
            echo "::error::$COMMIT did not reach main through a merged pull request: a release needs an approved release PR"
            exit 1
          fi
          for pr in $prs; do
            author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .user.login)"
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
            # Reviews come oldest first: the last non-comment state per reviewer is theirs.
            approvers="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
              --jq '.[] | [.user.login, .state, .commit_id] | @tsv' |
              awk -F'\t' -v author="$author" -v head="$head" '
                $1 ~ /\[bot\]$/ || $2 == "COMMENTED" || $2 == "PENDING" { next }
                { last[$1] = $2; at[$1] = $3 }
                END { for (u in last) if (u != author && last[u] == "APPROVED" && at[u] == head) print u }')"
            if [ -n "$approvers" ]; then
              approvers="$(echo $approvers)"
              echo "::notice::#$pr by $author, approved by $approvers"
              echo "- approved: #$pr (author $author) by $approvers" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::the release PR (#${prs// /, #}) has no approval from a reviewer other than its author on its final commit: nothing is published"
          exit 1

  gate:
    name: CI on the release commit
    needs: [plan, approval]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  publish:
    name: Tag and release
    needs: [plan, approval, gate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
    permissions:
      contents: write # the tag and the GitHub release
      pull-requests: read # the release notes, from the release PR's body
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Release notes from the release pull request
        id: notes
        run: |
          set -euo pipefail
          # The pull request the release commit came in with — a release-only one
          # ("chore(release): vX.Y.Z", opened on main) or a feature one whose branch
          # carried the bump (bin/release-prepare on a branch): the notes are between the
          # same markers in either.
          number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' || true)"
          if [ -z "$number" ]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --search "\"chore(release): $TAG\" in:title" \
              --json number,title --jq '[.[] | select(.title | contains(env.TAG))][0].number // empty' || true)"
          fi
          if [ -z "$number" ]; then
            echo "::notice::no merged release pull request for $TAG found: GitHub generates the notes"
            exit 0
          fi
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/pr-body.md"
          awk '/<!-- release-notes:end -->/ { inside = 0 } inside { print } /<!-- release-notes:start -->/ { inside = 1 }' \
            "$RUNNER_TEMP/pr-body.md" >"$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || cp "$RUNNER_TEMP/pr-body.md" "$RUNNER_TEMP/notes.md"
          printf '\nRelease pull request: #%s\n' "$number" >>"$RUNNER_TEMP/notes.md"
          echo "file=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"

      # `gh release create --target` creates the tag on the release commit and the
      # release in one call. Skipped when the release already exists (a resume).
      - name: Tag and GitHub release
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
            exit 0
          fi
          # --generate-notes needs no checkout; gh works against the API (--repo).
          if [ -n "${NOTES_FILE:-}" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$TAG" --generate-notes
          fi

      # Once the repository is public, ask the module proxy to fetch the new version now,
      # so pkg.go.dev and `go get @latest` see it without waiting for a first request.
      - name: Warm the Go module proxy
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        run: curl -fsS "https://proxy.golang.org/$PACKAGE/@v/$TAG.info"

  announce:
    name: Slack message
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      # The channel: swap the secret here (one place) to post somewhere else.
      SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: No Slack webhook
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::warning::the Slack webhook secret is not available to this repository; no message posted"

      - name: Post to a Slack channel
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "New release for rail0 SDK for Go (${{ needs.plan.outputs.tag }})",
            "blocks": [
              {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": ":gear: New release for <${{ github.event.repository.private && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, needs.plan.outputs.tag) || format('https://pkg.go.dev/github.com/commercelayer/rail0-go@{0}', needs.plan.outputs.tag) }}|rail0 SDK for Go>\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}|release notes>"
              }
              },
              {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*Project:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.event.repository.name }}>" },
                { "type": "mrkdwn", "text": "*Version:*\n${{ needs.plan.outputs.tag }}" }
              ]
              },
              {
              "type": "context",
              "elements": [
                { "type": "image", "image_url": "${{ github.event.sender.avatar_url }}", "alt_text": "${{ github.event.sender.login }}" },
                { "type": "mrkdwn", "text": "triggered by *${{ github.event.sender.login }}*" }
              ]
              }
            ]
            }
